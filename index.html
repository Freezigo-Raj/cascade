<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Edited between sessions and served from a fixed address, so a cached copy is
     a wrong answer that looks like a defect. -->
<meta http-equiv="Cache-Control" content="no-store">
<title>Cascade</title>

<!-- What a phone reads to put an icon on a home screen and open without a
     browser around it. `theme_color` and this tag have to agree or the bar
     above the app is a different colour from the app. -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#f5ead8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cascade">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">

<!-- No build step, so the one bare specifier in the shell is resolved here. -->
<script type="importmap">
{ "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
</script>

<!-- THE STYLESHEET CARRIES THE SHELL VERSION, and it has to.
     Every module is loaded under `?v=${Date.now()}` below, and this link was the
     one thing in the app without a query on it: the document is never cached and
     its stylesheet was, so a whole session's design landed on a browser that
     went on serving the previous one. That is the cache defect of sessions 96
     and 98 for the third time, in the one file type nobody had added the query
     to. A date cannot be written into a static file, so the number is the shell
     version, and `gate2.py` fails when it disagrees with `SHELL_VERSION` — the
     query on the two `@import` lines inside these files included, because an
     imported sheet is fetched under its own address and would go stale one level
     down otherwise. -->
<link rel="stylesheet" href="./shell/mvp.edit.css?v=31">

<div id="gate" style="display:none"></div>

<!-- Three panes, from the R2 web design. A phone fills only the middle one and
     leaves the rail and the detail panel empty, so they collapse and nothing has
     to be hidden. A wide window runs all three: the nav on the left, the capture
     box above the list in the middle, the selected task on the right. Which is
     which is decided in `mvp.js`, once. -->
<div id="app">
  <nav id="rail"></nav>
  <main id="main">
    <div id="capture"></div>
    <div id="screen"></div>
  </main>
  <aside id="aside"></aside>
</div>

<!-- The document is never cached, but a module it names is. Loading it under a
     fresh query each time is the only thing that reliably stops that, and the
     query is carried on to everything the module imports. -->
<script type="module">import(`./shell/mvp.js?v=${Date.now()}`);</script>

<!-- Registered after the app, never before it. A worker that installs first can
     answer the very requests that are loading the page it came from. -->
<script>
  if ("serviceWorker" in navigator) {
    addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
  }
</script>
